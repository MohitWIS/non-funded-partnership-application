<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Funded Partnership Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
</head>

<body>
    <div class="accent-strip" aria-hidden="true"></div>

    <div class="page">
        <!-- Header -->
        <header class="page-header">
            <div class="page-header-text">
                <h1>Non-Funded Partnership Applications</h1>
                <p class="subtitle">Form-sharing outreach, responses and case decisions</p>
            </div>
            <div class="page-header-actions">
                <span id="sample-badge" class="sample-badge" hidden>Sample data &mdash; open inside Zoho Creator for
                    live data</span>
                <span id="last-updated" class="last-updated"></span>
                <button id="refresh-btn" class="btn-refresh" type="button" title="Refresh data">
                    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                        <path
                            d="M13.65 2.35A7.96 7.96 0 0 0 8 0C3.58 0 .01 3.58.01 8S3.58 16 8 16c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 8 14 6 6 0 1 1 8 2c1.66 0 3.14.69 4.22 1.78L9 7h7V0l-2.35 2.35z"
                            fill="currentColor" />
                    </svg>
                    <span>Refresh</span>
                </button>
            </div>
        </header>

        <!-- Dashboard switch: A. Cumulative (till date) / B. Daily (today) -->
        <div class="segmented dash-switch" id="view-control" role="tablist" aria-label="Dashboard">
            <button type="button" role="tab" data-view="cumulative" class="is-selected" aria-selected="true">Cumulative
                (Till date)</button>
            <button type="button" role="tab" data-view="daily" aria-selected="false">Daily (Today)</button>
        </div>

        <!-- Filters: assignee + date range -->
        <div class="filter-row" role="group" aria-label="Filters">
            <span class="filter-label">Date range</span>
            <input id="date-from" class="filter-input" type="date" aria-label="From date">
            <span class="filter-label">to</span>
            <input id="date-to" class="filter-input" type="date" aria-label="To date">
            <button id="date-clear" class="btn-link" type="button">Clear</button>
            <span id="date-hint" class="filter-hint" hidden>Daily dashboard always shows today</span>
            <span class="filter-sep" aria-hidden="true"></span>
            <span class="filter-label">Assignee</span>
            <select id="assignee-control" class="filter-input" aria-label="Filter by assignee">
                <option value="all">All assignees</option>
            </select>
        </div>

        <!-- SDK error panel (hidden unless the SDK fails) -->
        <div id="boot-state" class="boot-state" hidden></div>

        <!-- Dashboard body -->
        <main id="dashboard" class="dashboard">

            <!-- KPI row -->
            <div class="section-head">
                <h2 id="kpi-title">Cumulative dashboard</h2>
                <span id="kpi-period" class="section-period"></span>
            </div>
            <section id="kpi-grid" class="kpi-grid" aria-label="Key metrics"></section>

            <!-- Charts -->
            <section class="charts-grid">
                <div class="card" id="trend-card">
                    <div class="card-head">
                        <div>
                            <h2>Emails sent vs responses received</h2>
                            <p class="card-sub" id="trend-sub"></p>
                        </div>
                        <div class="view-toggle" data-for="trend">
                            <button type="button" data-view="chart" class="is-selected">Chart</button>
                            <button type="button" data-view="table">Table</button>
                        </div>
                    </div>
                    <div class="card-body" id="trend-body"></div>
                </div>

                <div class="card" id="donut-card">
                    <div class="card-head">
                        <div>
                            <h2>Case status</h2>
                            <p class="card-sub" id="donut-sub"></p>
                        </div>
                        <div class="view-toggle" data-for="donut">
                            <button type="button" data-view="chart" class="is-selected">Chart</button>
                            <button type="button" data-view="table">Table</button>
                        </div>
                    </div>
                    <div class="card-body" id="donut-body"></div>
                </div>
            </section>

            <section class="card" id="assignee-card">
                <div class="card-head">
                    <div>
                        <h2>Cases by assignee</h2>
                        <p class="card-sub" id="assignee-sub"></p>
                    </div>
                    <div class="view-toggle" data-for="assignee">
                        <button type="button" data-view="chart" class="is-selected">Chart</button>
                        <button type="button" data-view="table">Table</button>
                    </div>
                </div>
                <div class="card-body" id="assignee-body"></div>
            </section>
        </main>
    </div>

    <div id="viz-tip" class="viz-tip" hidden></div>

    <script src="js/script.js"></script>
</body>

</html>
